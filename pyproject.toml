[project]
name = "imf-climate-insights"
version = "0.1.0"
description = "Climate–Economy analytics with IMF and open datasets"
authors = [{ name = "Cristina Girón" }]
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["imf_climate_insights"]
